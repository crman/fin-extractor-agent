[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-extractor-agent"
version = "0.1.0"
description = "Financial document extraction agent powered by Microsoft Agent Framework and Azure AI Foundry"
authors = [
    { name = "Chandresh Maniya", email = "crmaniya444@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agent-framework>=0.1.0",
    "agent-framework-foundry>=1.0.0",
    "azure-ai-contentsafety>=1.0.0",
    "azure-ai-projects>=1.0.0",
    "azure-identity>=1.15.0",
    "azure-monitor-opentelemetry>=1.8.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "pdfplumber>=0.11.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
